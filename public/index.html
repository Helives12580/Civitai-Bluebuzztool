<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>civitai Blue Buzz 助手</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="bolt">&#9889;</span>
    <div>
      <h1>Blue Buzz 助手</h1>
      <p class="sub">civitai 每日任务自动化 · civitai.com / civitai.red</p>
    </div>
  </div>

  <div class="topstatus">
    <div class="stat">
      <span class="k">今日收益</span>
      <span class="v" id="stat-earned">—</span>
    </div>
    <div class="stat">
      <span class="k">UTC 重置</span>
      <span class="v mono" id="stat-reset">—</span>
    </div>
    <div class="stat">
      <span class="k">账号</span>
      <span class="v" id="stat-account">—</span>
    </div>
    <div class="stat">
      <span class="k">连接</span>
      <span class="v" id="stat-conn"><i class="dot"></i> 连接中</span>
    </div>
  </div>
</header>

<main class="grid">

  <section class="col-main">

    <div class="panel runbar">
      <div class="runbar-left">
        <select id="account-select" class="select"></select>
        <button id="btn-verify" class="btn ghost">验证 Key</button>
        <button id="btn-scan" class="btn">扫描当前可做任务</button>
      </div>
      <div class="runbar-right">
        <span class="scan-sum" id="scan-summary"></span>
        <button id="btn-cancel" class="btn ghost" disabled>中止</button>
        <button id="btn-run" class="btn primary" disabled>开始完成</button>
      </div>
    </div>

    <div class="panel scanbar" id="scan-bar" hidden>
      <div class="panel-head">
        <h2>扫描结果</h2>
        <span class="hint" id="scan-meta">—</span>
      </div>
      <div id="scan-body" class="scan-body"></div>
    </div>

    <div class="panel" id="tasks-panel">
      <div class="panel-head">
        <h2>任务中心</h2>
        <span class="hint" id="tasks-hint">—</span>
      </div>
      <div id="tasks" class="tasks"></div>
    </div>

  </section>

  <aside class="col-side">

    <div class="panel">
      <div class="panel-head"><h2>账号</h2></div>
      <div id="account-list" class="acc-list"></div>
      <button id="btn-run-all" class="btn block">批量处理全部启用账号</button>
      <p class="note">按「并发账号数」执行，默认 1 即一个做完才做下一个。</p>
      <form id="form-account" class="form">
        <input type="text" id="f-name" placeholder="备注名（可选）" autocomplete="off">
        <select id="f-host">
          <option value="com">civitai.com</option>
          <option value="red">civitai.red</option>
        </select>
        <input type="password" id="f-key" placeholder="API Key" autocomplete="off" required>
        <button type="submit" class="btn primary block">添加账号</button>
        <p class="note">
          Key 在 civitai「账号设置 → API Keys」创建。建议 scope 给足：
          <code>BuzzRead</code> + <code>SocialWrite</code> + <code>Full</code>
          （未声明 scope 的过程隐含要求 Full）。Key 仅存本机
          <code>data/config.json</code>。
        </p>
      </form>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>设置</h2></div>
      <label class="row">
        <span>自动模式</span>
        <input type="checkbox" id="s-auto">
      </label>
      <label class="row">
        <span>每日执行时刻</span>
        <input type="time" id="s-runat" class="mono">
      </label>
      <label class="row">
        <span title="同时处理的账号数；1 = 一个做完才做下一个">并发账号数</span>
        <input type="number" id="s-concurrency" min="1" max="8" class="mono">
      </label>
      <label class="row">
        <span>反应目标次数</span>
        <input type="number" id="s-reactions" min="0" max="50" class="mono">
      </label>
      <label class="row">
        <span>关注目标人数</span>
        <input type="number" id="s-follows" min="0" max="3" class="mono">
      </label>
      <label class="row">
        <span title="站点限速为 60 次/分钟，1 秒即贴着该上限">反应间隔 (秒)</span>
        <span class="pair">
          <input type="number" id="s-delay-min" min="0" max="120" step="0.5" class="mono">
          <em>~</em>
          <input type="number" id="s-delay-max" min="0" max="300" step="0.5" class="mono">
        </span>
      </label>
      <div class="row">
        <span>下次自动运行</span>
        <span class="mono muted" id="s-next">—</span>
      </div>
      <button id="btn-save-settings" class="btn block">保存设置</button>
    </div>

    <div class="panel logs-panel">
      <div class="panel-head">
        <h2>运行日志</h2>
        <button id="btn-clear-log" class="btn tiny ghost">清屏</button>
      </div>
      <div id="logs" class="logs"></div>
    </div>

  </aside>

</main>

<div id="toast" class="toast"></div>

<script src="/app.js"></script>
</body>
</html>
